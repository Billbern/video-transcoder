# Local development stack with hot-reloading and DB ports exposed to the host.
# Run: docker compose -f docker-compose.dev.yml up --build
name: videotranscoder-dev

x-backend-base: &backend-base
  build:
    context: ./backend
    dockerfile: Dockerfile
  environment: &backend-env
    DATABASE_URL: postgresql+asyncpg://vt:vt@postgres:5432/videotranscoder
    SYNC_DATABASE_URL: postgresql+psycopg2://vt:vt@postgres:5432/videotranscoder
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT: http://minio:9000
    S3_REGION: us-east-1
    S3_ACCESS_KEY: minioadmin
    S3_SECRET_KEY: minioadmin
    S3_BUCKET_INGEST: raw-videos
    S3_BUCKET_OUTPUT: processed-videos
    S3_PRESIGN_EXPIRY_SECONDS: "3600"
    MAX_UPLOAD_BYTES: "2147483648"
    CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    LOG_LEVEL: INFO
  volumes:
    - ./backend/app:/app/app
    - transcoder-tmp:/tmp/transcoder
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
    minio:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vt
      POSTGRES_PASSWORD: vt
      POSTGRES_DB: videotranscoder
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vt -d videotranscoder"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-10-29T16-01-48Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-10-29T15-34-59Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/raw-videos &&
      mc mb --ignore-existing local/processed-videos &&
      echo 'MinIO buckets ready.'
      "

  backend:
    <<: *backend-base
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"

  worker:
    <<: *backend-base
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=1

  beat:
    <<: *backend-base
    command: celery -A app.workers.celery_app beat --loglevel=INFO
    depends_on:
      backend:
        condition: service_started
      worker:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
  transcoder-tmp:
