# Production stack (used by CI/CD on the Hetzner VPS).
# Pulls pre-built images from GHCR. Environment variables come from .env on the host.
#
# Reverse proxy / TLS is handled by **Nginx Proxy Manager** (NPM), which is run
# separately (it manages multiple apps on the VPS via its web UI). This stack
# does NOT publish ports 80/443 to the host — NPM proxies to the containers
# over the shared `videotranscoder` Docker network.
#
# One-time setup on the VPS (see docs/nginx-proxy-manager.md for full steps):
#
#   docker network connect videotranscoder <npm-container-name>
#
# Then in the NPM UI, create a Proxy Host for your domain:
#   Forward Hostname = `frontend`  (or `backend` for API-only)
#   Forward Port     = `80`        (or `8000` for backend)
#   SSL              = "Request a new SSL Certificate" (Let's Encrypt)
#
# The frontend's nginx (Sprint 3) reverse-proxies /api, /docs, /openapi.json
# to backend:8000 inside the same network, so a single NPM Proxy Host entry
# covers the whole app.
name: videotranscoder

x-backend-base: &backend-base
  image: ghcr.io/${REPO_OWNER}/video-transcoder-backend:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file: .env
  volumes:
    - transcoder-tmp:/tmp/transcoder
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
    minio:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 20s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-29T16-01-48Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data

  # API. NPM proxies the whole site to `frontend`; the frontend's nginx then
  # routes /api, /docs, /openapi.json to this service.
  backend:
    <<: *backend-base
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"

  worker:
    <<: *backend-base
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=2

  beat:
    <<: *backend-base
    command: celery -A app.workers.celery_app beat --loglevel=INFO
    depends_on:
      - worker

  # Built/published by CI (Sprint 3). Serves the React SPA and reverse-proxies
  # /api/* to backend:8000 over the same Docker network.
  frontend:
    image: ghcr.io/${REPO_OWNER}/video-transcoder-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

volumes:
  postgres-data:
  minio-data:
  transcoder-tmp:

networks:
  default:
    # Stable, friendly name so Nginx Proxy Manager (run as a separate compose
    # project) can join it:
    #
    #   docker network connect videotranscoder <npm-container-name>
    #
    # After that, create a Proxy Host in the NPM UI with
    # Forward Hostname = `frontend` (or `backend`) and the matching port.
    name: videotranscoder
